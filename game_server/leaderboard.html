<!DOCTYPE html>
<html>
<head>
  <title>Live Leaderboard</title>
  <style>
    body { font-family: monospace; background: #111; color: #0ff; padding: 20px; }
    ol { font-size: 1.2em; }
  </style>
</head>
<body>
  <h2>Live Leaderboard (SSE)</h2>
  <div id="status">Connecting...</div>
  <ol id="board"></ol>

  <script>
    const status = document.getElementById("status");
    const board = document.getElementById("board");
    const source = new EventSource("http://localhost:8000/leaderboard-stream");

    source.onopen = () => { status.textContent = "Connected"; };
    source.onerror = () => { status.textContent = "Connection error/reconnecting..."; };

    source.onmessage = (event) => {
      const leaderboard = JSON.parse(event.data);
      board.innerHTML = leaderboard
        .map(p => `<li>${p.player} — score: ${p.score.toFixed(1)}</li>`)
        .join("");
    };
  </script>
</body>
</html>
